<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline · Finance Tracker</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc;
           font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #1e293b; text-align: center; }
    p { color: #475569; }
    button { padding: .5rem 1rem; border: 0; border-radius: .5rem; background: #059669; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Finance Tracker needs a connection to load your latest numbers.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
