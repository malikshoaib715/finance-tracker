# One-click deploy on Render: a web service running Puma (GoodJob runs jobs
# in-process) and a managed PostgreSQL database.
databases:
  - name: finance-tracker-db
    plan: free
    databaseName: finance_tracker_production
    user: finance_tracker

services:
  - type: web
    name: finance-tracker
    runtime: ruby
    plan: free
    buildCommand: bundle install && bin/rails assets:precompile && bin/rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: APP_HOST
        sync: false
      - key: WEB_CONCURRENCY
        value: 0
